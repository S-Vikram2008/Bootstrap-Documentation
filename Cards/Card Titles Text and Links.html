<html>
<head>
<title>Understanding Card Titles Text and Links</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="card">
        <div class="card-header">
            This is card header section
        </div>
        <div class="card-body">
            <p class="card-title">This is card title section</p>
            <p class="card-text">This is card text section</p>
            <a href="#" class="card-link">This is a card link section</a>
        </div>
        <div class="card-footer">
            This is card footer section
        </div>
    </div>
  </div>
</body>
</html>
