<html>
<head>
<title>Carousel</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://static.files.bbci.co.uk/webarchive/asset/147181a266fc0f5ab7f470bc96a33d9514ca180f693309c973fca9cccca62e4a.jpeg" alt="Doctor Who" class="d-block" style="width: 100%;">
            </div>
            <div class="carousel-item">
                <img src="https://image.tmdb.org/t/p/original/t80YBrH7ejiv4vu3Hibq1zHv9MX.jpg" alt="Doctor Who" class="d-block" style="width: 100%;">
            </div>
            <div class="carousel-item">
                <img src="https://static.files.bbci.co.uk/webarchive/asset/147181a266fc0f5ab7f470bc96a33d9514ca180f693309c973fca9cccca62e4a.jpeg" alt="Doctor Who" class="d-block" style="width: 100%;">
            </div>


        </div>
        <button type="button" data-bs-target="#demo" class="carousel-control-prev" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button type="button" data-bs-target="#demo" class="carousel-control-next" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</body>
</html>
