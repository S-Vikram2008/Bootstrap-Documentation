<html>
<head>
<title>Carousel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div class="container">
    <h4>Spinner-Border Example : </h4>
    <button type="button" class="btn btn-primary" disabled><span class="spinner-border spinner-border-sm"></span> Loading ... </button>
    <h4>Spinner-Grow Example : </h4>
    <button type="button" class="btn btn-primary" disabled><span class="spinner-grow spinner-grow-sm"></span> Loading</button>
  </div>

</body>
</html>
