<html>
<head>
<title>Nested Button Groups</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="btn-group">
        <button type="button" class="btn btn-primary">Home</button>
        <button type="button" class="btn btn-success">Profile</button>
        <div class="btn-group">
            <button type="button" class="btn btn-danger dropdown-toggle" data-bs-toggle="dropdown">Courses</button>
            <ul class="dropdown-menu">
                <li><a href="#" class="dropdown-item">Python</a></li>
                <li><a href="#" class="dropdown-item">Java</a></li>
                <li><a href="#" class="dropdown-item">Web Development</a></li>
            </ul>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-warning dropdown-toggle" data-bs-toggle="dropdown">Settings</button>
            <ul class="dropdown-menu">
                <li><a href="#" class="dropdown-item">Account Settings</a></li>
                <li><a href="#" class="dropdown-item">Privacy</a></li>
            </ul>
        </div>
    </div>
  </div>
</body>
</html>
