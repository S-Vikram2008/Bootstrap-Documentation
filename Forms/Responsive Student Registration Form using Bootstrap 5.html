<html>
<head>
    <title>Responsive Student Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="background-color:  #E91E63;">
  <div class="container">
        <div class="card shadow p-4">
            <p class="card-header h3">Registration Form</p>
            <div class="card-body">
                <form>
                    <div class="container">
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label" for="firstname">First Name</label><br>
                                <input id="firstname" class="form-control">
                            </div>
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label" for="lastname">Last Name</label><br>
                                <input id="lastname" class="form-control">
                            </div>
                        </div>
                    
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label">Birthday</label>
                                <input type="date" class="form-control">
                            </div>
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label">Gender</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input type="radio" id="male" name="gender" class="form-check-input" >
                                        <label class="form-check-label">Male</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="radio" id="female" name="gender" class="form-check-input">
                                        <label class="form-check-label">Female</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label" for="phone-no">Phone number</label>
                                <input type="tel" id="phone-no" class="form-control">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label">Subject</label>
                                <select class="form-select">
                                    <option>Subject</option>
                                    <option>Communicative English</option>
                                    <option>Mathematics II</option>
                                    <option>Electronics and Electrical Engineering</option>
                                    <option>Data Structures and Algorithms</option>
                                    <option>Computer Science</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <br>
                    <input type="submit" class="btn btn-primary">
                </form>
            </div>
        </div>
    </div>
</body>

</html>
